<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="countdown">
    <div id="years"><div class="numo"></div><label>years</label></div>
    <div id="months"><div class="numo"></div><label>months</label></div>
    <div id="days"><div class="numo"></div><label>days</label></div>
    <div id="hours"><div class="numo"></div><label>hours</label></div>
    <div id="minutes"><div class="numo"></div><label>minutes</label></div>
    <div id="seconds"><div class="numo"></div><label>seconds</label></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
